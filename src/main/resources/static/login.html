<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie – FormBridge</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<style>
  :root { --ink:#1b1f24; --muted:#5b6470; --line:#d6dbe1; --bg:#f6f7f9; --card:#fff; --accent:#0b5cad; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  main:focus { outline:none; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:32px 28px; }
  .logo { display:block; margin:0 auto 8px; height:64px; width:auto; }
  h1 { font-size:22px; margin:16px 0 4px; text-align:center; }
  .lead { margin:0 0 24px; color:var(--muted); text-align:center; }
  label { display:block; font-weight:600; margin:14px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid #6b7684; border-radius:6px; font:inherit; color:inherit; background:#fff; }
  button { width:100%; margin-top:22px; font:inherit; font-weight:600; padding:11px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  :focus-visible { outline:3px solid #b45309; outline-offset:2px; }
  .msg { margin:16px 0 0; padding:10px 12px; border-radius:6px; background:#fbe9e7; color:var(--err); }
  .msg.info { background:#eaf2fb; color:#0b4a8b; }
  .msg:empty { display:none; }
  .alt { margin:20px 0 0; text-align:center; font-size:14px; }
  .alt a { color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:14px; padding:16px; }
</style>
</head>
<body>
<main id="main" tabindex="-1">
  <div class="card">
    <img class="logo" src="/assets/logo.png" alt="FormBridge – z wniosku do eUsługi" width="340" height="64">
    <h1>Logowanie</h1>
    <p class="lead">Zaloguj się danymi klienta API, aby konwertować formularze.</p>
    <p id="info" class="msg info" role="status"></p>
    <form id="login" novalidate>
      <label for="clientId">Identyfikator klienta</label>
      <input id="clientId" name="clientId" type="text" autocomplete="username" required aria-required="true" aria-describedby="error">
      <label for="clientSecret">Hasło klienta</label>
      <input id="clientSecret" name="clientSecret" type="password" autocomplete="current-password" required aria-required="true" aria-describedby="error">
      <button id="submit" type="submit">Zaloguj</button>
      <p id="error" class="msg" role="alert"></p>
    </form>
    <p class="alt"><a href="/" id="noauth">Kontynuuj bez logowania</a> (gdy uwierzytelnianie jest wyłączone na serwerze)</p>
  </div>
</main>
<footer>FormBridge · HackNation 2026 · Cyfryzacja formularzy</footer>
<script>
const $ = id => document.getElementById(id);
const reason = new URLSearchParams(location.search).get('reason');
if (reason === 'expired') $('info').textContent = 'Sesja wygasła. Zaloguj się ponownie.';
if (reason === 'logout') $('info').textContent = 'Wylogowano.';
$('clientId').focus();

$('noauth').onclick = () => {
  sessionStorage.clear();
  sessionStorage.setItem('fb.noauth', '1');
};

$('login').onsubmit = async e => {
  e.preventDefault();
  $('error').textContent = '';
  const clientId = $('clientId').value.trim();
  const clientSecret = $('clientSecret').value;
  if (!clientId || !clientSecret) {
    $('error').textContent = 'Podaj identyfikator i hasło klienta.';
    (clientId ? $('clientSecret') : $('clientId')).focus();
    return;
  }
  $('submit').disabled = true;
  $('submit').textContent = 'Logowanie…';
  try {
    const r = await fetch('/api/v1/auth/token', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId, clientSecret }) });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(r.status === 401 ? 'Nieprawidłowy identyfikator lub hasło klienta.' : (body.detail || 'Logowanie nie powiodło się (HTTP ' + r.status + ').'));
    sessionStorage.clear();
    sessionStorage.setItem('fb.token', body.access_token);
    sessionStorage.setItem('fb.exp', String(Date.now() + body.expires_in * 1000));
    sessionStorage.setItem('fb.client', clientId);
    location.replace('/');
  } catch (err) {
    $('error').textContent = err.message === 'Failed to fetch' ? 'Brak połączenia z serwerem.' : err.message;
    $('clientSecret').value = '';
    $('clientSecret').focus();
    $('submit').disabled = false;
    $('submit').textContent = 'Zaloguj';
  }
};
</script>
</body>
</html>
